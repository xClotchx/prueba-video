<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Control de Paneo Interactivo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #contenedor {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    /* El video cubre la pantalla completa */
    #video-paneo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #boton-iniciar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 14px 28px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    #indicador {
      position: absolute;
      top: 30px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="contenedor">
    <div id="indicador">Mueve el móvil o arrastra para ver alrededor</div>

    <video 
      id="video-paneo" 
      src="video.mp4" 
      preload="auto" 
      playsinline 
      webkit-playsinline 
      muted>
    </video>

    <button id="boton-iniciar">Tocar para interactuar</button>
  </div>

  <script>
    const video = document.getElementById('video-paneo');
    const contenedor = document.getElementById('contenedor');
    const boton = document.getElementById('boton-iniciar');

    let videoDuracion = 0;
    let tiempoObjetivo = 0;
    let tiempoActual = 0;
    let toqueInicioX = 0;
    let sensorActivo = false;

    video.addEventListener('loadedmetadata', () => {
      videoDuracion = video.duration;
      // Colocar el video a la mitad del paneo al iniciar
      tiempoObjetivo = videoDuracion / 2;
      tiempoActual = tiempoObjetivo;
      video.currentTime = tiempoActual;
    });

    boton.addEventListener('click', async () => {
      boton.style.display = 'none';
      
      // Reproducir y pausar de inmediato para desbloquear el buffer en iOS
      video.play().then(() => {
        video.pause();
      }).catch(e => console.log(e));

      // Solicitar permiso de giroscopio en iOS
      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permiso = await DeviceOrientationEvent.requestPermission();
          if (permiso === 'granted') {
            window.addEventListener('deviceorientation', manejarGiroscopio);
            sensorActivo = true;
          }
        } catch (error) {
          console.warn('Permiso giroscopio denegado:', error);
        }
      } else {
        window.addEventListener('deviceorientation', manejarGiroscopio);
        sensorActivo = true;
      }
    });

    // Control mediante Giroscopio físico
    function manejarGiroscopio(e) {
      if (!videoDuracion) return;

      // gamma mide inclinación de -90 a 90 grados
      // Tomamos un rango cómodo de movimiento: de -35° (izquierda) a +35° (derecha)
      const rangoGrados = 35;
      let inclinacion = Math.max(-rangoGrados, Math.min(rangoGrados, e.gamma || 0));

      // Normalizar de 0 (extremo izquierdo) a 1 (extremo derecho)
      let porcentaje = (inclinacion + rangoGrados) / (rangoGrados * 2);

      tiempoObjetivo = porcentaje * videoDuracion;
    }

    // Control táctil (arrastrar con el dedo)
    contenedor.addEventListener('touchstart', (e) => {
      toqueInicioX = e.touches[0].clientX;
    }, { passive: true });

    contenedor.addEventListener('touchmove', (e) => {
      if (!videoDuracion) return;
      const diferenciaX = e.touches[0].clientX - toqueInicioX;
      
      // Sensibilidad del arrastre
      const factorSensibilidad = videoDuracion / window.innerWidth;
      tiempoObjetivo = Math.max(0, Math.min(videoDuracion, tiempoObjetivo - (diferenciaX * factorSensibilidad)));
      
      toqueInicioX = e.touches[0].clientX;
    }, { passive: true });

    // Animación continua para sincronizar los fotogramas suavemente
    function sincronizarCuadros() {
      // Suavizado tipo Lerp para que no salte tosco entre fotogramas
      tiempoActual += (tiempoObjetivo - tiempoActual) * 0.15;

      if (Math.abs(video.currentTime - tiempoActual) > 0.03) {
        video.currentTime = tiempoActual;
      }

      requestAnimationFrame(sincronizarCuadros);
    }

    sincronizarCuadros();
  </script>
</body>
</html>
