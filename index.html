<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Visor Panorámico Interactivo (Foto)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #contenedor {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    /* La foto cubre todo el alto del móvil y desborda libremente a lo ancho */
    #foto-panoramica {
      position: absolute;
      height: 100%;
      width: auto;
      min-width: 100%;
      object-fit: cover;
      transform: translateX(0px);
      will-change: transform;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #boton-iniciar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 14px 28px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    #indicador {
      position: absolute;
      top: 30px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="contenedor">
    <div id="indicador">Mueve el móvil o arrastra para explorar</div>

    <!-- Reemplaza "panorama.jpg" con tu foto muy ancha -->
    <img 
      id="foto-panoramica" 
      src="paronama.JPG" 
      alt="Paisaje Panorámico"
      onload="inicializarMargenes()"
    />

    <button id="boton-iniciar">Tocar para explorar</button>
  </div>

  <script>
    const foto = document.getElementById('foto-panoramica');
    const contenedor = document.getElementById('contenedor');
    const boton = document.getElementById('boton-iniciar');

    let desplazamientoMaximo = 0;
    let posicionActual = 0;
    let posicionObjetivo = 0;
    let toqueInicioX = 0;

    // Calcular el excedente que queda a los lados para mover la foto
    function inicializarMargenes() {
      const anchoFoto = foto.getBoundingClientRect().width;
      const anchoPantalla = window.innerWidth;
      
      // La mitad de la diferencia es lo que podemos mover a cada lado
      desplazamientoMaximo = Math.max(0, (anchoFoto - anchoPantalla) / 2);
      foto.style.opacity = "1"; // Mostrar la foto con suavidad cuando esté lista
    }

    window.addEventListener('resize', inicializarMargenes);

    boton.addEventListener('click', async () => {
      boton.style.display = 'none';
      inicializarMargenes();

      // Solicitar permisos de giroscopio en iOS (Safari requiere HTTPS)
      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permiso = await DeviceOrientationEvent.requestPermission();
          if (permiso === 'granted') {
            window.addEventListener('deviceorientation', manejarGiroscopio);
          }
        } catch (error) {
          console.warn('Permiso de giroscopio denegado:', error);
        }
      } else {
        window.addEventListener('deviceorientation', manejarGiroscopio);
      }
    });

    // Control por giroscopio (mover el móvil físicamente)
    function manejarGiroscopio(e) {
      if (desplazamientoMaximo <= 0) inicializarMargenes();
      
      // gamma mide inclinación de -90 a 90 grados
      // Rango de sensibilidad de -35° a 35° de inclinación
      const inclinacion = Math.max(-35, Math.min(35, e.gamma || 0));
      
      // Mapear inclinación directamente a la posición X de la imagen
      posicionObjetivo = -(inclinacion / 35) * desplazamientoMaximo;
    }

    // Control táctil (arrastrar para ver más rápido o sin sensor)
    contenedor.addEventListener('touchstart', (e) => {
      toqueInicioX = e.touches[0].clientX;
    }, { passive: true });

    contenedor.addEventListener('touchmove', (e) => {
      if (desplazamientoMaximo <= 0) inicializarMargenes();
      const diferenciaX = e.touches[0].clientX - toqueInicioX;
      
      // Actualizar la posición del objetivo basándonos en el arrastre (sensibilidad 1.3)
      posicionObjetivo = Math.max(-desplazamientoMaximo, Math.min(desplazamientoMaximo, posicionObjetivo + diferenciaX * 1.3));
      
      toqueInicioX = e.touches[0].clientX;
    }, { passive: true });

    // Bucle para dar un movimiento suave de transición
    function suavizarMovimiento() {
      // Interpolación para lograr un efecto inercial muy natural
      posicionActual += (posicionObjetivo - posicionActual) * 0.12;
      
      foto.style.transform = `translateX(${posicionActual}px)`;
      requestAnimationFrame(suavizarMovimiento);
    }

    suavizarMovimiento();
  </script>
</body>
</html>
